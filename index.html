<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>ぼうけんの たび(しさく)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="200"></canvas>
  <div id="ui">
    <div id="hint1" class="hint ruby">ゆびを おいて すべらせると あるけるよ</div>
    <div id="hint2" class="hint ruby">「!」を {タップ|たっぷ}すると おはなし できるよ</div>
    <div id="act"><div class="mark">!</div><div class="lbl" id="actlbl">はなす</div></div>
    <div id="sbase"></div><div id="sknob"></div>
    <div id="hpchip"></div>
    <canvas id="clockcv" width="64" height="64"></canvas>
    <div id="menubtn" class="ruby">{メニュー|めにゅー}</div>
    <div id="decobtn">もようがえ</div>
    <div id="deco"></div>
    <div id="actbtn"><span id="actbtnlbl">はなす</span></div>
    <div id="menu"></div>
    <div id="shop"></div>
    <div id="paint"></div>
    <div id="mini"></div>
    <div id="care"></div>
    <div id="dlg"><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
    <!-- 戦闘 -->
    <div id="battle"><div id="bstat"></div><div id="bnote"></div><div id="bmsg"></div><div id="bcmd"></div></div>
    <!-- なまえを いれる -->
    <div id="names"></div>
    <div id="title"><h1>ぼうけんの たび</h1><div class="sub">しさくばん</div><div class="tap ruby" id="taptxt">{タップ|たっぷ}して はじめる</div><div id="pcorner"><span class="bar"></span><span class="plbl">おとな</span></div><div id="dataerr"></div></div>
    <!-- 保護者メニュー(タイトル右上を3秒長押し) -->
    <div id="parent">
      <div class="ptitle">保護者メニュー</div>
      <div class="prow" id="pSound"><span class="plabel">音の大きさ</span><button data-l="0">オフ</button><button data-l="1">小</button><button data-l="2">中</button><button data-l="3">大</button></div>
      <div class="prow"><button id="pExport">セーブコードを表示してコピー</button></div>
      <textarea id="pCode" spellcheck="false" placeholder="取っておいたセーブコードをここに貼りつけて「読み込む」を押してください"></textarea>
      <div class="prow"><button id="pImport">読み込む</button><button id="pNew" class="warn">はじめから</button><button id="pClose">閉じる</button></div>
      <div id="pMsg"></div>
    </div>
  </div>
</div>
