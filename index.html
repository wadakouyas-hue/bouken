<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>ぼうけんの たび(しさく)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="200"></canvas>
  <div id="ui">
    <div id="hint1" class="hint ruby">ゆびを おいて すべらせると あるけるよ</div>
    <div id="hint2" class="hint ruby">「!」を {タップ|たっぷ}すると おはなし できるよ</div>
    <div id="act"><div class="mark">!</div><div class="lbl" id="actlbl">はなす</div></div>
    <div id="sbase"></div><div id="sknob"></div>
    <div id="dlg"><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
    <div id="title"><h1>ぼうけんの たび</h1><div class="sub">しさくばん</div><div class="tap ruby">{タップ|たっぷ}して はじめる</div></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
